<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="readnovel_part2_title">LEGNAXE: Heaven Above, Human Heart</title>
    <meta name="description" content="LEGNAXE Part 2: Heaven Above, Human Heart. Follow Healiangel and Lucifer in the decisive battle on Earth for ultimate balance.">
    <meta property="og:title" content="LEGNAXE: Heaven Above, Human Heart (Part 2)" data-lang-key="og_title_part2_full">
    <meta property="og:description" content="Read LEGNAXE Part 2, discover the continuing saga of the celestial war.">
    <meta property="og:image" content="/images/pages/novels/legnaxe2horizontal.png">
    <meta property="og:url" content="https://ivs.id.vn/Pages/Novels/read-legnaxe_part2_en.html">
    <meta property="og:type" content="article">

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="https://cdn.tailwindcss.com?plugins=typography,forms,aspect-ratio,line-clamp"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    },
                    colors: {
                        primary: '#3b82f6',
                        'primary-dark': '#2563eb',
                    }
                }
            },
            plugins: [],
        }
    </script>

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="../css/reader.css">
</head>
<body class="text-gray-800 dark:text-gray-200 transition-colors duration-300 ease-in-out font-sans antialiased" id="page-readnovel">
    <header id="header-placeholder"></header>

    <!-- Top Fixed Progress Bar -->
    <div class="progress-shell-fixed">
        <div class="progress-bar progress-bar-glow h-1" style="width: 0%"></div>
    </div>

    <main class="max-w-4xl mx-auto px-4 pt-6 pb-28 sm:pb-12 sm:px-6 lg:px-8">
        <h1 class="novel-main-title text-3xl sm:text-5xl font-extrabold text-center text-slate-900 dark:text-slate-100 mb-6 tracking-tight" data-lang-key="readnovel_part2_title">LEGNAXE: Part 2 - Heaven Above, Human Heart</h1>
        
        <img src="../images/legnaxe2horizontal.jpg" alt="LEGNAXE Part 2 Banner" class="novel-banner-img mb-6 rounded-2xl shadow-xl w-full max-h-[300px] sm:max-h-[380px] object-cover border border-slate-200 dark:border-slate-800" 
             onerror="this.onerror=null; this.src='https://placehold.co/1200x400/374151/ffffff?text=LEGNAXE+Part+2+Banner';">

        <!-- Dynamic Sticky Toolbar Injected by JS -->
        <div class="reader-toolbar mb-6"></div>

        <div class="story-content-wrapper p-5 sm:p-10 rounded-3xl transition-all duration-300">
            <!-- Dynamic Chapter Content Area -->
            <div id="dynamic-chapter-content">
                <p class="text-center text-gray-500 dark:text-gray-400">Loading story chapter...</p>
            </div>

            <!-- Bottom Navigation Bar -->
            <div class="navigation hidden sm:flex flex-col sm:flex-row justify-between items-center mt-10 mb-2 gap-3">
                <a href="/Pages/apps/story/index.html" class="w-full sm:w-auto px-5 py-2.5 rounded-xl font-semibold text-white bg-slate-700 hover:bg-slate-800 transition-all flex items-center justify-center">
                    <i class="fas fa-house mr-2"></i>Story Home
                </a>
                <div class="flex gap-3 w-full sm:w-auto">
                    <button id="prev-chapter-btn" class="flex-1 sm:flex-initial px-6 py-2.5 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-700 transition-all flex items-center justify-center disabled:opacity-40 disabled:cursor-not-allowed">
                        <i class="fas fa-arrow-left mr-2"></i>Previous Chapter
                    </button>
                    <button id="next-chapter-btn" class="flex-1 sm:flex-initial px-6 py-2.5 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-700 transition-all flex items-center justify-center disabled:opacity-40 disabled:cursor-not-allowed">
                        Next Chapter<i class="fas fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <button id="scroll-to-top-btn" title="Back to top" class="hidden fixed bottom-20 right-5 sm:right-6 sm:bottom-6 bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-full shadow-xl z-40 transition-all">
        <i class="fas fa-arrow-up"></i>
    </button>

    <footer id="footer-placeholder"></footer>

    <!-- Scripts -->
    <script src="/js/utils.js"></script>
    <script src="/js/language.js"></script>
    <script src="/ai/js/loadComponents.js"></script>
    <script src="../js/chapter-loader.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const storyPath = 'legnaxe_part2';
            const totalChapters = 40;
            const hasSpecialChapter = false;
            const lang = 'en';

            if (typeof initializeChapterLoader === 'function') {
                initializeChapterLoader(storyPath, totalChapters, hasSpecialChapter, lang);
            }
            
            const scrollToTopBtn = document.getElementById('scroll-to-top-btn');
            scrollToTopBtn?.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            window.addEventListener('scroll', () => {
                if (window.pageYOffset > 300) {
                    scrollToTopBtn?.classList.remove('hidden');
                } else {
                    scrollToTopBtn?.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
