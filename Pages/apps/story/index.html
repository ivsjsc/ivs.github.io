<!DOCTYPE html>
<html lang="vi" class="scroll-smooth dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Truyện LEGNAXE - IVS Creative Stories</title>
    <meta name="description" content="Khám phá bộ tiểu thuyết LEGNAXE từ IVS — hành trình giữa Thiên Đàng và Trần Gian, giữa ánh sáng và bóng tối, giữa sứ mệnh và lòng người.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Cinzel', 'serif'],
                    },
                }
            }
        }
    </script>

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">

    <style>
        :root {
            --bg-page: #F4F3EF;
            --bg-card: #FAFAF8;
            --border-card: rgba(0,0,0,0.07);
            --text-primary: #1a1a1a;
            --text-muted: #6B7280;
            --accent: #C9A96E;
            --accent-dark: #A07840;
            --glow: rgba(201,169,110,0.15);
        }
        .dark {
            --bg-page: #0F0E0C;
            --bg-card: #1A1916;
            --border-card: rgba(255,255,255,0.06);
            --text-primary: #F0EDE6;
            --text-muted: #9CA3AF;
            --glow: rgba(201,169,110,0.12);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
        }

        /* ========= HERO ========= */
        .hero-section {
            position: relative;
            overflow: hidden;
            padding: 80px 24px 64px;
            text-align: center;
        }
        .hero-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 70% 60% at 50% 0%, rgba(201,169,110,0.18) 0%, transparent 70%);
            pointer-events: none;
        }
        .dark .hero-section::before {
            background: radial-gradient(ellipse 70% 60% at 50% 0%, rgba(201,169,110,0.10) 0%, transparent 70%);
        }

        .hero-eyebrow {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
            display: block;
        }
        .hero-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.2rem, 6vw, 4.2rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            margin: 0 0 16px;
        }
        .hero-title span {
            color: var(--accent);
        }
        .hero-subtitle {
            max-width: 520px;
            margin: 0 auto;
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Ornamental divider */
        .ornament {
            display: flex;
            align-items: center;
            gap: 14px;
            max-width: 240px;
            margin: 40px auto 36px;
        }
        .ornament::before,
        .ornament::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
            opacity: 0.4;
        }
        .ornament span {
            color: var(--accent);
            font-size: 16px;
            opacity: 0.6;
        }

        /* ========= SEARCH BAR ========= */
        .search-wrapper {
            max-width: 500px;
            margin: 0 auto 12px;
            position: relative;
            padding: 0 24px;
        }
        .search-wrapper input {
            width: 100%;
            padding: 13px 20px 13px 46px;
            border-radius: 50px;
            border: 1px solid var(--border-card);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .search-wrapper input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--glow);
        }
        .search-wrapper input::placeholder {
            color: var(--text-muted);
        }
        .search-icon {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
        }

        /* ========= NOVEL CARDS ========= */
        .novels-grid {
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
            padding: 0 24px 80px;
        }

        .novel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .novel-card:hover {
            transform: translateY(-3px);
            border-color: rgba(201,169,110,0.25);
            box-shadow: 0 12px 40px rgba(0,0,0,0.10);
        }
        .dark .novel-card:hover {
            box-shadow: 0 12px 40px rgba(0,0,0,0.45);
            border-color: rgba(201,169,110,0.20);
        }

        @media (min-width: 600px) {
            .novel-card {
                flex-direction: row;
            }
        }

        /* Cover image */
        .novel-cover {
            width: 100%;
            height: 210px;
            object-fit: cover;
            flex-shrink: 0;
            display: block;
        }
        @media (min-width: 600px) {
            .novel-cover {
                width: 210px;
                height: auto;
                min-height: 200px;
            }
        }

        /* Card body */
        .novel-body {
            padding: 22px 26px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Header row */
        .novel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .novel-badge {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 50px;
            background: rgba(201,169,110,0.12);
            color: var(--accent-dark);
            border: 1px solid rgba(201,169,110,0.25);
        }
        .dark .novel-badge {
            color: var(--accent);
        }
        .novel-part {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.03em;
        }

        /* Title & description */
        .novel-title {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.35;
            color: var(--text-primary);
            margin: 0;
            transition: color 0.2s;
        }
        .novel-description {
            font-size: 0.875rem;
            line-height: 1.8;
            color: var(--text-muted);
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Footer row */
        .novel-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: auto;
        }

        /* Language toggle */
        .lang-toggle {
            display: inline-flex;
            align-items: center;
            border-radius: 50px;
            border: 1px solid var(--border-card);
            overflow: hidden;
            background: var(--bg-page);
        }
        .lang-btn {
            padding: 7px 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-muted);
            transition: background 0.18s, color 0.18s;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.02em;
            line-height: 1;
        }
        .lang-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }
        .lang-btn.active {
            background: var(--accent);
            color: #1a1a1a;
            font-weight: 700;
        }

        /* Read button */
        .read-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            background: var(--accent);
            color: #1a1a1a;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            letter-spacing: 0.02em;
            flex-shrink: 0;
        }
        .read-btn:hover {
            background: var(--accent-dark);
            color: #fff;
            transform: translateX(2px);
            box-shadow: 0 4px 16px rgba(160,120,64,0.3);
        }

        /* Author line */
        .novel-author {
            font-size: 11px;
            color: var(--text-muted);
        }
        .novel-author strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* ========= NO RESULTS ========= */
        .no-results {
            text-align: center;
            padding: 60px 24px;
            color: var(--text-muted);
            display: none;
            max-width: 860px;
            margin: 0 auto;
        }
        .no-results.visible { display: block; }
        .no-results i {
            font-size: 2.2rem;
            margin-bottom: 14px;
            opacity: 0.35;
            display: block;
        }
        .no-results p { margin: 0 0 6px; }

        /* ========= SCROLLBAR ========= */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(201,169,110,0.3); border-radius: 3px; }
    </style>

    <meta property="og:url" content="https://ivsacademy.edu.vn/Pages/apps/story/index.html">
    <meta property="og:title" content="Kho Truyện LEGNAXE - IVS Creative Stories">
    <meta property="og:description" content="Khám phá bộ tiểu thuyết LEGNAXE — hành trình kỳ bí giữa Thiên Đàng và Trần Gian.">
</head>
<body>

    <!-- Header -->
    <div id="header-placeholder"></div>

    <main>
        <!-- ===== HERO ===== -->
        <section class="hero-section">
            <span class="hero-eyebrow">IVS Creative Universe</span>
            <h1 class="hero-title">Kho Truyện <span>LEGNAXE</span></h1>
            <p class="hero-subtitle">
                Hành trình kỳ bí giữa Thiên Đàng và Trần Gian, giữa ánh sáng và bóng tối —<br>
                nơi sứ mệnh gặp lòng người.
            </p>
        </section>

        <!-- ===== SEARCH ===== -->
        <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input
                type="text"
                id="storySearch"
                placeholder="Tìm theo tiêu đề, tác giả..."
                oninput="filterStories()"
                autocomplete="off"
            >
        </div>

        <!-- ===== ORNAMENT DIVIDER ===== -->
        <div class="ornament">
            <span>✦</span>
        </div>

        <!-- ===== NOVELS GRID ===== -->
        <div class="novels-grid" id="novelsGrid">
            <!-- Rendered by JS -->
        </div>

        <!-- No Results -->
        <div class="no-results" id="noResults">
            <i class="fas fa-search"></i>
            <p style="font-size:1rem; font-weight:600;">Không tìm thấy truyện nào.</p>
            <p style="font-size:0.875rem;">Thử tìm với từ khóa khác nhé.</p>
        </div>
    </main>

    <!-- FAB & Footer -->
    <div id="fab-container-placeholder"></div>
    <div id="footer-placeholder"></div>

    <!-- External Scripts -->
    <script src="/js/utils.js"></script>
    <script src="/js/language.js?v=20260821.5"></script>
    <script src="/ai/js/fabController.js"></script>
    <script src="/js/loadComponents.js?v=20260821.5"></script>

    <script>
        /**
         * Dữ liệu truyện — chỉ những file thực sự tồn tại.
         * Mỗi entry là một TÁC PHẨM, có cả phiên bản VI và EN.
         */
        const novelsData = [
            {
                id: 'legnaxe-part1',
                part: 'Phần 1 / Part 1',
                badge: 'Tiểu Thuyết',
                title_vi: 'LEGNAXE: Bí Mật Cuộc Đại Chiến Thiên Đàng',
                title_en: 'LEGNAXE: The Secret of Great Heaven War',
                desc_vi: 'Phần 1 mở ra nguồn gốc xung đột giữa các thiên thần — sự tạo dựng loài người, những lựa chọn định mệnh, và hạt giống của cuộc đại chiến vĩ đại trên Thiên Đàng.',
                desc_en: 'Part 1 unveils the origins of the great conflict between angels — the creation of humankind, fateful choices, and the seeds of the greatest war Heaven has ever known.',
                langs: {
                    vi: 'novels/read-legnaxe_part1_vi.html',
                    en: 'novels/read-legnaxe_part1_en.html',
                },
                author: 'NMT',
                cover: 'images/legnaxe1horizontal.jpg',
                coverFallback: 'https://placehold.co/420x240/1A1916/C9A96E?text=LEGNAXE+Part+1',
            },
            {
                id: 'legnaxe-part2',
                part: 'Phần 2 / Part 2',
                badge: 'Tiểu Thuyết',
                title_vi: 'LEGNAXE: Thiên Thượng, Lòng Người',
                title_en: "LEGNAXE: Heavenly, Human's Heart",
                desc_vi: 'Phần 2 theo chân Healiangel và Lucifer trên Trần Gian — trận chiến định mệnh cuối cùng để giành lấy sự cân bằng giữa hai thế giới.',
                desc_en: 'Part 2 follows Healiangel and Lucifer on Earth — the final fateful battle to reclaim balance between two worlds.',
                langs: {
                    vi: 'novels/read-legnaxe_part2_vi.html',
                    en: 'novels/read-legnaxe_part2_en.html',
                },
                author: 'NMT',
                cover: 'images/legnaxe2horizontal.jpg',
                coverFallback: 'https://placehold.co/420x240/1A1916/C9A96E?text=LEGNAXE+Part+2',
            },
        ];

        /** Trạng thái ngôn ngữ đang chọn cho mỗi card */
        const cardLangs = {};
        novelsData.forEach(n => { cardLangs[n.id] = 'vi'; });

        /** Chuyển đổi ngôn ngữ của một card */
        function setCardLang(novelId, lang) {
            cardLangs[novelId] = lang;

            const card = document.querySelector(`[data-novel-id="${novelId}"]`);
            if (!card) return;
            const novel = novelsData.find(n => n.id === novelId);
            if (!novel) return;

            card.querySelector('.novel-title').textContent = novel[`title_${lang}`];
            card.querySelector('.novel-description').textContent = novel[`desc_${lang}`];
            card.querySelector('.read-btn').href = novel.langs[lang];
            card.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }

        /** Render HTML cho một novel card */
        function renderNovelCard(novel) {
            const lang = cardLangs[novel.id] || 'vi';
            return `
<article class="novel-card" data-novel-id="${novel.id}" data-title-vi="${novel.title_vi}" data-title-en="${novel.title_en}" data-author="${novel.author}">
    <img src="${novel.cover}" alt="${novel.title_vi}" class="novel-cover"
         onerror="this.onerror=null;this.src='${novel.coverFallback}';" loading="lazy">
    <div class="novel-body">
        <div class="novel-header">
            <span class="novel-badge">${novel.badge}</span>
            <span class="novel-part">${novel.part}</span>
        </div>
        <div>
            <h2 class="novel-title">${novel[`title_${lang}`]}</h2>
            <p class="novel-description" style="margin-top:8px;">${novel[`desc_${lang}`]}</p>
        </div>
        <div class="novel-footer">
            <div class="lang-toggle" role="group" aria-label="Chọn ngôn ngữ">
                <button class="lang-btn ${lang === 'vi' ? 'active' : ''}" data-lang="vi"
                        onclick="setCardLang('${novel.id}', 'vi')">🇻🇳 Tiếng Việt</button>
                <button class="lang-btn ${lang === 'en' ? 'active' : ''}" data-lang="en"
                        onclick="setCardLang('${novel.id}', 'en')">🇬🇧 English</button>
            </div>
            <a href="${novel.langs[lang]}" class="read-btn">
                Đọc Ngay <i class="fas fa-arrow-right" style="font-size:11px;"></i>
            </a>
        </div>
        <p class="novel-author">Tác giả: <strong>${novel.author}</strong></p>
    </div>
</article>`;
        }

        /** Lọc và render danh sách truyện */
        function filterStories() {
            const term = document.getElementById('storySearch').value.toLowerCase().trim();
            const grid = document.getElementById('novelsGrid');
            const noResults = document.getElementById('noResults');

            const filtered = novelsData.filter(novel => {
                if (!term) return true;
                return (
                    novel.title_vi.toLowerCase().includes(term) ||
                    novel.title_en.toLowerCase().includes(term) ||
                    novel.author.toLowerCase().includes(term)
                );
            });

            grid.innerHTML = filtered.map(renderNovelCard).join('');

            noResults.classList.toggle('visible', filtered.length === 0);
        }

        document.addEventListener('DOMContentLoaded', filterStories);
    </script>
</body>
</html>
